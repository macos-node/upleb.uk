# /etc/nginx/sites-available/upleb.uk
# Replaces the old LND-viz vhost. cgit web frontend over the bare repos
# created by ngit-relay at /opt/ngit-relay/volumes/repos/.

server {
    server_name upleb.uk www.upleb.uk;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/upleb.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upleb.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # NIP-05 file (host-side; create /home/upleb/upleb-nip05/nostr.json to populate)
    location = /.well-known/nostr.json {
        alias /home/upleb/upleb-nip05/nostr.json;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    # cgit static assets (CSS, logo, favicon) — served directly
    location /cgit-css/ {
        alias /usr/share/cgit/;
        expires 7d;
    }

    # Everything else goes to cgit via fcgiwrap
    location / {
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgit/cgit.cgi;
        fastcgi_param PATH_INFO       $uri;
        fastcgi_param QUERY_STRING    $args;
        fastcgi_param HTTP_HOST       $server_name;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           on;
        fastcgi_param REMOTE_ADDR     $remote_addr;
        include       /etc/nginx/fastcgi_params;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name upleb.uk www.upleb.uk;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
